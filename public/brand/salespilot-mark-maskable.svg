  <rect x="32" y="32" width="192" height="192" rx="42" fill="#171717" />
  <text
    x="128"
    y="166"
    text-anchor="middle"
    font-family="Inter, SF Pro Display, Helvetica, Arial, sans-serif"
    font-size="108"
    font-weight="700"
    fill="#ffffff"
  >S</text>
</svg>
