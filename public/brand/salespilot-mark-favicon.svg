<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 256 256"
  width="256"
  height="256"
>
  <!--
    Favicon / PWA "any" icons:
    Transparent outside + white squircle pad (reads cleanly on dark install UIs)
    + slightly inset black mark so a thin white ring is visible.
  -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#ffffff" />
  <rect x="28" y="28" width="200" height="200" rx="44" fill="#171717" />
  <text
    x="128"
    y="168"
    text-anchor="middle"
    font-family="Inter, SF Pro Display, Helvetica, Arial, sans-serif"
    font-size="112"
    font-weight="700"
    fill="#ffffff"
  >S</text>
</svg>
